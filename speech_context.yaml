# Speech context (word boosting)
#
# 여기 적은 단어/구문은 인식할 때 우선적으로 고려된다. (도메인 용어, 고유명사, 자주 틀리는 단어)
# 파일을 저장하면 다음 요청(새 WebSocket 연결, 파일 업로드)부터 자동으로 반영된다. 서버 재시작 불필요.
# 현재 적용된 내용 확인: GET /api/speech-context  (형식이 잘못되면 error 에 사유가 나오고 이전 내용이 유지된다)
#
# 작성 요령
#  - 실제로 "말하는 대로" 적는다. 'GPU' 보다 '지피유'. (영문 표기는 오히려 주변 인식을 망칠 수 있다)
#  - boost: 0 초과 5.0 이하. 2.0 부터 시작해 0.5 씩 조정한다.
#    높을수록 강하게 끌어당기지만 과보정도 늘어난다. 테스트에서 boost 3.0 일 때
#    '십 밀리초' → '실시간 감지초', '음성인식 테스트' → '음성 인식 서버' 같은 오인식이 생겼다.
#  - 발음이 비슷한 다른 말이 자주 나오는 구문은 그 말까지 끌어당기므로 주의한다.
#  - 변경 후 POST /api/transcribe/conversation 에 speech_context=true / false 로 각각 요청해 비교한다.
#  - 그룹(name)은 관리용 구분일 뿐이며, 그룹마다 boost 를 다르게 줄 수 있다.

default_boost: 2.0   # 그룹에 boost 가 없을 때 사용

contexts:
  # 실제 마이크 테스트에서 틀렸던 단어: 상담사→상단성, 음성→운성, 실시간 감지→실시간 감수
  - name: 상담 도메인
    boost: 2.0
    phrases:
      - 상담사
      - 음성
      - 실시간 감지
      - 욕설
      - STT
