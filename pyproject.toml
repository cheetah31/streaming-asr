[project]
name = "streaming-asr1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "cheetah31", email = "wltkqdl@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "numpy>=2.5.4",
    "pydantic-settings>=2.16.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
streaming-asr1 = "streaming_asr1:main"
streaming-asr1-setup = "streaming_asr1.setup_runtime:main"

[project.optional-dependencies]
colab = [
    "ngrok>=1.7.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
